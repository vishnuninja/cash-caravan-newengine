events{}
http {
    include /etc/nginx/mime.types;
    server {
        listen 8089;
        server_name localhost;
        root /usr/src/app;
        index index.html;
        
        location = /history/index.html {
            alias /usr/src/app/history/index.html;
            add_header Cache-Control no-cache;
        }

        location = /history/round.html {
            alias /usr/src/app/history/round.html;
            add_header Cache-Control no-cache;
        }

        location = /pfrRound/pfr_round.html {
            alias /usr/src/app/pfrRound/pfr_round.html;
            add_header Cache-Control no-cache;
        }

        
        # Serve static assets (images, CSS, JS) directly without fallback
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|css|js|json|woff|woff2|ttf|eot|otf)$ {
            root /usr/src/app;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        
        # Serve game assets directory (including sourceAssets)
        location /games/ {
            root /usr/src/app;
            try_files $uri =404;
        }
        
        location / {
            try_files $uri $uri/ /index.html;
        }
        

    }
}
