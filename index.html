	<script>
		(function () {
			const devUrl = 'https://demo.ninjagaming.com/ui-plugin/';
			const isLocalhost = ['localhost', '127.0.0.1', '0.0.0.0', '::1'].includes(location.hostname);
			const isDev = location.href.startsWith('https://dev-h3-games.ninjagaming.com/');

			const base = (isLocalhost || isDev) ? devUrl : getUIPluginBase();

			function appendCss(src) {
				const link = document.createElement('link');
				link.rel = 'stylesheet';
				link.href = base + src;
				document.head.appendChild(link);
			}

			function appendJs(src) {
				const script = document.createElement('script');
				script.src = base + src;
				script.defer = true;
				document.body.appendChild(script);
			}

			appendCss('game-ui.css');
			appendJs('game-ui.js');
		})();


	function getUIPluginBase() {
		const ORIGIN = window.location.origin; 
		const UI_PLUGIN_BASE = new URL("/ui-plugin/", ORIGIN).toString();
		return UI_PLUGIN_BASE
	}
	</script>
